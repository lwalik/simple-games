<div class="w-full mx-auto grid grid-cols-2 md:grid-cols-4 gap-4 mt-4">
  <div
    class="bg-slate-700 grid grid-cols-4 gap-2 drop-shadow-lg"
    *ngFor="let game of games$ | async"
  >
    <img class="col-span-4" [src]="game.img" alt="Brak" />
    <h3 class="text-slate-300 text-center col-span-4">{{ game.name }}</h3>
    <a
      class="col-span-4 my-2 mx-2"
      mat-flat-button
      color="warn"
      [routerLink]="game.url"
    >
      Play
    </a>
  </div>
</div>
