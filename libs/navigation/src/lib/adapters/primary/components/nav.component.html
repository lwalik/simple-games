<div class="flex items-center h-12 text-sm text-white mt-4 font-light">
  <ul class="w-full flex justify-end gap-4">
    <li *ngFor="let link of navLinks$ | async" class="">
      <a class="mx-2 px-2 hover:font-normal" [routerLink]="link.url">
        {{ link.name }}
      </a>
    </li>
  </ul>
</div>
