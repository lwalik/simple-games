<div class="flex items-center h-3/4 mt-20 font-light">
  <div class="grid grid-cols-2 gap-4 mx-auto w-1/3">
    <div *ngFor="let link of navLinks$ | async" class="col-span-1 m-4">
      <div
        class="outline outline-offset-4 outline-purple-400 hover:outline-green-500 hover:font-normal p-8 flex justify-center items-center rounded-md"
        *ngIf="link.name !== 'Logout' && link.name !== 'Login'"
      >
        <a class="text-white text-2xl" [routerLink]="link.url">
          {{ link.name }}
        </a>
      </div>

      <div
        class="outline outline-offset-4 outline-red-700 p-8 flex justify-center items-center rounded-md"
        *ngIf="link.name === 'Login' && (context$ | async)"
      >
        <button class="text-white text-2xl" [routerLink]="link.url" disabled>
          {{ link.name }}
        </button>
      </div>
      <div
        class="outline outline-offset-4 outline-purple-400 hover:outline-green-500 hover:font-normal p-8 flex justify-center items-center rounded-md"
        *ngIf="link.name === 'Login' && !(context$ | async)"
      >
        <button class="text-white text-2xl" [routerLink]="link.url">
          {{ link.name }}
        </button>
      </div>

      <div
        class="outline outline-offset-4 outline-red-700 p-8 flex justify-center items-center rounded-md"
        *ngIf="link.name === 'Logout' && !(context$ | async)"
      >
        <button class="text-white text-2xl" [routerLink]="link.url" disabled>
          {{ link.name }}
        </button>
      </div>
      <div
        class="outline outline-offset-4 outline-purple-400 hover:outline-green-500 hover:font-normal p-8 flex justify-center items-center rounded-md"
        *ngIf="link.name === 'Logout' && (context$ | async)"
      >
        <button
          class="text-white text-2xl"
          [routerLink]="link.url"
          (click)="onLogOutButtonClicked()"
        >
          {{ link.name }}
        </button>
      </div>
    </div>
  </div>
</div>
