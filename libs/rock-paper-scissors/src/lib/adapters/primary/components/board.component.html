<div
  class="h-full w-4/5 grid grid-cols-3 gap-8 mt-24 mx-auto"
  *ngIf="(players$ | async)?.isVisible"
>
  <div
    class="col-span-1 row-span-1 grid grid-rows-3 me-4"
    *ngIf="(players$ | async)?.currentPlayer as current"
  >
    <mat-card
      class="example-card h-full p-0 row-start-2"
      *ngIf="current.username"
    >
      <mat-card-subtitle class="mb-0"
        ><p class="px-4 text-center">
          Current: {{ current.username }}
        </p></mat-card-subtitle
      >

      <div
        class="flex justify-center"
        *ngIf="!current.isReady; else notReadyCurrent"
      >
        <button
          mat-raised-button
          color="accent"
          class="w-full"
          (click)="onReadyButtonClicked()"
          [disabled]="!current.choice"
        >
          Ready
        </button>
        <button
          mat-raised-button
          color="warn"
          class="w-full"
          (click)="onPickButtonClicked()"
        >
          Pick
        </button>
      </div>

      <ng-template #notReadyCurrent>
        <div class="flex justify-center">
          <button
            mat-raised-button
            color="accent"
            class="w-full"
            (click)="onReadyButtonClicked()"
          >
            Cancel
          </button>
        </div>
      </ng-template>
    </mat-card>
  </div>

  <div
    class="col-span-2 grid grid-cols-2 gap-4"
    *ngIf="(players$ | async)?.otherPlayers as others"
  >
    <div
      class="flex flex-row items-center justify-center"
      *ngFor="let other of others"
    >
      <mat-card class="example-card p-0">
        <mat-card-subtitle class="mb-0">
          <p class="px-4 text-center">Other: {{ other.username }}</p>
        </mat-card-subtitle>

        <div
          class="flex justify-center"
          *ngIf="!other.isReady; else notReadyOther"
        >
          <p>Waiting</p>
        </div>
        <ng-template #notReadyOther>
          <div class="flex justify-center text-green-400">
            <p>Ready</p>
          </div>
        </ng-template>
      </mat-card>
    </div>
  </div>
</div>
