<div
  class="mt-8 h-4/5 w-full mx-auto bg-violet-400 shadow-inner rounded-lg flex items-center justify-center fade-in"
  *ngIf="players$ | async as players"
>
  <div class="grid grid-cols-3 w-5/6 h-full mb-24">
    <div
      class="grid grid-rows-3 grid-flow-col justify-center gap-4"
      *ngFor="let player of players; let i = index"
    >
      <div
        class="row-start-2 flex flex-col items-center justify-center border-4 rounded-2xl px-4 shadow-lg"
        *ngIf="i % 2 !== 0"
      >
        <p class="text-center text-white">{{ player.username }}</p>
        <p class="text-center text-white" *ngIf="player.choice.isVisible">
          {{ player.choice.name }}
        </p>
        <div *ngIf="player.isCurrent">
          <div
            class="flex justify-center"
            *ngIf="!player.isReady; else notReadyCurrent"
          >
            <button
              mat-raised-button
              color="accent"
              class="w-full"
              (click)="onReadyButtonClicked()"
              [disabled]="!player.choice.name"
            >
              Ready
            </button>
            <button
              mat-raised-button
              color="warn"
              class="w-full"
              (click)="onPickButtonClicked()"
            >
              Pick
            </button>
          </div>

          <ng-template #notReadyCurrent>
            <div class="flex justify-center">
              <button
                mat-raised-button
                color="accent"
                class="w-full"
                (click)="onNextButtonClicked()"
                *ngIf="!player.wantNext"
              >
                Next
              </button>
              <button
                mat-raised-button
                color="accent"
                class="w-full"
                (click)="onCancelButtonClicked()"
                *ngIf="player.wantNext"
              >
                Cancel
              </button>
            </div>
          </ng-template>
        </div>
      </div>

      <div
        class="row-start-3 flex flex-col items-center justify-center border-4 rounded-2xl px-4 shadow-lg"
        *ngIf="i % 2 === 0"
      >
        <p class="text-center text-white">{{ player.username }}</p>
        <p class="text-center text-white" *ngIf="player.choice.isVisible">
          {{ player.choice.name }}
        </p>
        <div *ngIf="player.isCurrent">
          <div
            class="flex justify-center"
            *ngIf="!player.isReady; else notReadyCurrent"
          >
            <button
              mat-raised-button
              color="accent"
              class="w-full"
              (click)="onReadyButtonClicked()"
              [disabled]="!player.choice.name"
            >
              Ready
            </button>
            <button
              mat-raised-button
              color="warn"
              class="w-full"
              (click)="onPickButtonClicked()"
            >
              Pick
            </button>
          </div>

          <ng-template #notReadyCurrent>
            <div class="flex justify-center">
              <button
                mat-raised-button
                color="accent"
                class="w-full"
                (click)="onNextButtonClicked()"
                *ngIf="!player.wantNext"
              >
                Next
              </button>
              <button
                mat-raised-button
                color="accent"
                class="w-full"
                (click)="onCancelButtonClicked()"
                *ngIf="player.wantNext"
              >
                Cancel
              </button>
            </div>
          </ng-template>
        </div>
      </div>
    </div>
  </div>
</div>
