<div class="h-full w-4/5 grid grid-cols-2 gap-8 my-24 mx-auto">
  <mat-card
    class="example-card h-full p-0"
    *ngFor="let player of players$ | async"
  >
    <mat-card-subtitle class="mb-0"
      ><p class="px-4 text-center">{{ player.username }}</p></mat-card-subtitle
    >

    <div class="flex justify-center">
      <button mat-raised-button color="accent" class="w-full">Ready</button>
      <button mat-raised-button color="warn" class="w-full">Pick</button>
    </div>
  </mat-card>
</div>

<p>{{ context$ | async | json }}</p>
