<div *ngIf="(isVisible$ | async)?.isStringVisible">
  <div class="w-full grid grid-cols-1 mb-2 mx-auto">
    <p class="md:text-2xl text-center text-black text-base">
      Waiting for all players...
    </p>
  </div>
  <div *ngIf="players$ | async as players">
    <ul
      *ngIf="(isVisible$ | async)?.isBtnsVisible"
      class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 md:gap-4 gap-2"
    >
      <li *ngFor="let player of players">
        <div
          *ngIf="
            player.isActive &&
              ((gameContext$ | async)?.queueStatus || !(gameContext$ | async));
            else disabledButton
          "
          class="flex items-center justify-center"
        >
          <button
            class="md:h-16 h-8 w-8"
            mat-flat-button
            color="warn"
            (click)="onPlusButtonClicked(player)"
          >
            +
          </button>
        </div>
        <ng-template #disabledButton>
          <div class="flex items-center justify-center">
            <button
              class="md:h-16 h-8 w-8"
              mat-flat-button
              color="warn"
              disabled
            >
              +
            </button>
          </div>
        </ng-template>
      </li>
    </ul>
  </div>
</div>
