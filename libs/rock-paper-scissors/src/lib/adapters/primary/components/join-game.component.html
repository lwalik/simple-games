<div class="mt-4 w-full" *ngIf="player$ | async as player">
  <div
    class="flex justify-center items-center gap-4"
    *ngIf="!(inGame$ | async)?.inGame && !(queueStatus$ | async)?.status"
  >
    <div class="text-center text-sm">
      <p>Hello {{ player.current.username }}</p>
      <p>Join to the Game</p>
    </div>

    <button
      class="w-36"
      mat-raised-button
      color="accent"
      (click)="onJoinButtonClicked(player.current)"
    >
      Join
    </button>
  </div>
</div>
