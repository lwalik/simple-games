<div class="w-full grid grid-cols-1 mb-2 mx-auto">
  <p class="text-2xl text-center text-amber-500">Waiting for all players...</p>
</div>
<div *ngIf="players$ | async as players">
  <ul class="grid grid-cols-3 lg:grid-cols-6 gap-4">
    <li *ngFor="let player of players">
      <div
        *ngIf="
          !player.isActive &&
          (context$ | async)?.email?.length !== 0 &&
          (context$ | async)
        "
      >
        <button
          class="h-16 w-16"
          mat-flat-button
          color="warn"
          (click)="onJoinButtonClicked(player, context)"
          *ngIf="context$ | async as context"
        >
          +
        </button>
      </div>
      <div
        *ngIf="
          player.isActive ||
          (context$ | async)?.email?.length === 0 ||
          !(context$ | async)
        "
      >
        <button class="h-16 w-16" mat-flat-button color="warn" disabled>
          +
        </button>
      </div>
    </li>
  </ul>
</div>
