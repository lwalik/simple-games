<div class="mt-4 w-full" *ngIf="player$ | async as player">
  <div class="flex justify-center items-center gap-4" *ngIf="player.isActive">
    <div class="text-center text-sm">
      <p>Hello {{ player.username }}</p>
      <p>Join to the Game</p>
    </div>

    <button
      class="w-36"
      mat-raised-button
      color="accent"
      (click)="onJoinButtonClicked()"
    >
      Join
    </button>
  </div>
</div>
