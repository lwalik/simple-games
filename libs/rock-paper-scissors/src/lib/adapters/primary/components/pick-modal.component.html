<div class="grid grid-cols-3 gap-4">
  <button

    (click)="onChoiceButtonClicked('rock')"
  >
    Rock
  </button>

  <button
    class="w-full h-24 bg-orange-400"
    value="paper"

  <button
    class="w-full h-24 bg-orange-400"
    value="scissors"
    (click)="onChoiceButtonClicked('scissors')"
  >
    Scissors
  </button>
</div>
