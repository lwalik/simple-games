<div class="w-1/2 bg-slate-300 mx-auto my-auto mt-32 py-6 rounded-md fade-in">
  <div class="w-full grid grid-cols-12 items-center">
    <p class="text-3xl text-center text-amber-500 col-span-4 col-start-5">
      Login
    </p>

    <a class="col-span-1 col-start-12 text-amber-500" routerLink="/">
      <svg
        fill="currentColor"
        class="bi bi-arrow-left-square"
        viewBox="0 0 24 24"
      >
        <path
          fill-rule="evenodd"
          d="M15 2a1 1 0 0 0-1-1H2a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V2zM0 2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V2zm11.5 5.5a.5.5 0 0 1 0 1H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5H11.5z"
        />
      </svg>
    </a>
  </div>
  <form
    [formGroup]="userForm"
    class="example-form grid grid-cols-1 gap-4 mt-6 w-4/6 mx-auto"
    (ngSubmit)="onLoginSubmitted(userForm)"
  >
    <mat-form-field class="example-full-width" appearance="fill">
      <mat-label class="text-purple-600">Email</mat-label>
      <input
        type="email"
        matInput
        placeholder="Ex. pat@example.com"
        formControlName="email"
      />
    </mat-form-field>
    <mat-form-field class="example-full-width" appearance="fill">
      <mat-label class="text-purple-600">Password</mat-label>
      <input type="password" matInput value="" formControlName="password" />
    </mat-form-field>

    <button
      class="text-amber-400 mb-4"
      type="submit"
      mat-raised-button
      color="primary"
    >
      Login
    </button>
  </form>
</div>
