<div
  *ngIf="word$ | async as word"
  class="flex mx-auto mb-10 h-8 justify-center"
>
  <div
    *ngFor="let letter of word.cutWord"
    class="w-8 text-center min-h-full mx-3 text-3xl text-white outline outline-offset-4 outline-purple-400"
  >
    {{ letter }}
  </div>
</div>

<button mat-raised-button color="accent" (click)="onStartBtnClicked()">
  New Word
</button>
<p>{{ context$ | async | json }}</p>
